[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ore-no-lovecome"
version = "1.0.0"
description = "俺のラブコメはこんなはずじゃなかった - 美少女ゲームをメタる青春ラブコメディ"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mizushima", email = "example@email.com"},
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: General Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Documentation",
]
dependencies = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocs-material-extensions>=1.3.1",
    "pymdown-extensions>=10.7",
]

[project.urls]
Homepage = "https://github.com/kmizu/ore-no-lovecome-ha-konnna-hazu-ja-nakatta"
Documentation = "https://kmizu.github.io/ore-no-lovecome-ha-konnna-hazu-ja-nakatta"
Repository = "https://github.com/kmizu/ore-no-lovecome-ha-konnna-hazu-ja-nakatta"

[project.scripts]
ore-no-lovecome-build = "scripts.build:main"
ore-no-lovecome-serve = "scripts.serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
